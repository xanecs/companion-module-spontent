name: Module Checks

# Self-contained equivalent of bitfocus/actions/.github/workflows/module-checks.yaml.
#
# The upstream reusable workflow declares only "packages: read" for its job, which
# leaves the job token without "contents: read". That is fine for the public bitfocus
# module repositories, but it makes actions/checkout fail with "Repository not found"
# here, because this repository is private and a caller cannot widen the permissions a
# reusable workflow declares. So the checks are reproduced locally instead.
#
# Keep this in sync with upstream when the module is submitted to the Bitfocus
# developer portal, since the portal runs the upstream checks on the packaged module.

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        description: 'Upload the package as an artifact'
        required: false
        default: false
      prerelease:
        type: boolean
        description: 'If set, this is a prerelease'
        required: false
        default: false

jobs:
  package-module:
    name: Package module
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Determine nodejs version
        id: determine-nodejs
        shell: bash
        run: |
          NODE_VERSION=$(jq -r '.runtime.type' companion/manifest.json)
          echo "Node.js runtime: $NODE_VERSION"

          case "$NODE_VERSION" in
            node18) echo "version=18.x" >> "$GITHUB_OUTPUT" ;;
            node22) echo "version=22.x" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unknown runtime.type '$NODE_VERSION' in companion/manifest.json"
              exit 99
              ;;
          esac

      - name: Use Node.js ${{ steps.determine-nodejs.outputs.version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.determine-nodejs.outputs.version }}

      - name: Enable corepack
        shell: bash
        run: corepack enable

      - name: Check for incorrect lockfiles
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "Error: package-lock.json file found. This repository should use yarn, not npm."
            exit 1
          fi
          if [ ! -f yarn.lock ]; then
            echo "Error: yarn.lock file not found. This repository must use yarn."
            exit 1
          fi

      - name: Collect info
        id: collect-info
        shell: bash
        run: |
          MODULE_NAME=$(basename "$GITHUB_REPOSITORY") # remove the owner from the repository name

          if [[ "$MODULE_NAME" != companion-module-* ]]; then
            echo "Unknown repository name format: $MODULE_NAME. Repository name must start with companion-module-"
            exit 99
          fi
          MODULE_NAME=${MODULE_NAME#companion-module-}

          echo "module-name=$MODULE_NAME" >> "$GITHUB_OUTPUT"

          MANIFEST_ID=$(jq -r '.id' companion/manifest.json)
          if [ "$MANIFEST_ID" != "$MODULE_NAME" ]; then
            echo "Module manifest.json id '$MANIFEST_ID' does not match github repository name '$MODULE_NAME'"
            exit 99
          fi

          # When building a tag, the tag must match the version in package.json
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PACKAGE_VERSION=$(jq -r '.version' package.json)
            if [ "$TAG_NAME" != "$PACKAGE_VERSION" ] && [ "$TAG_NAME" != "v$PACKAGE_VERSION" ]; then
              echo "Module package.json version '$PACKAGE_VERSION' does not match git tag '$TAG_NAME'"
              exit 99
            fi
          fi

          if grep -q "your-module-name" companion/manifest.json; then
            echo "Module manifest contains references to your-module-name!"
            exit 99
          fi

          if ! jq -e '.products | arrays and length > 0' companion/manifest.json > /dev/null; then
            echo "Module manifest product list is either empty or does not exist"
            exit 99
          fi

          if ! jq -e '.runtime.apiVersion == "0.0.0"' companion/manifest.json > /dev/null; then
            echo "Module manifest should have default 0.0.0 runtime.apiVersion"
            exit 99
          fi

          if [ ! -f companion/HELP.md ]; then
            echo "Module help file companion/HELP.md does not exist"
            exit 99
          fi

      - name: Setup Github packages auth
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          # For npm/yarn classic
          echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" >> ~/.npmrc

          # For Yarn Berry (3+)
          if yarn --version 2>/dev/null | grep -qE '^[3-9]\.'; then
            yarn config set 'npmRegistries["//npm.pkg.github.com"].npmAuthToken' "${GH_PACKAGES_TOKEN}"
          fi

      - name: Install dependencies
        shell: bash
        run: yarn install

      - name: Enforce module-tools version
        shell: bash
        run: |
          set -e
          PKG="@companion-module/tools"

          # Resolve the actually-installed version of PKG. We can't just read
          # `<pkg>/package.json`: Node's "exports" field frequently blocks that
          # subpath (ERR_PACKAGE_PATH_NOT_EXPORTED). Instead resolve the package's
          # main entry (always allowed) and walk up to the nearest package.json
          # whose name matches.
          INSTALLED=$(yarn node -e '
            const fs = require("fs"), path = require("path");
            const name = process.argv[1];
            let dir = path.dirname(require.resolve(name));
            while (dir !== path.dirname(dir)) {
              const pj = path.join(dir, "package.json");
              if (fs.existsSync(pj)) {
                const j = JSON.parse(fs.readFileSync(pj, "utf8"));
                if (j.name === name) { process.stdout.write(j.version); process.exit(0); }
              }
              dir = path.dirname(dir);
            }
            process.exit(3);
          ' "$PKG" 2>/dev/null) || {
            echo "::error::Could not resolve $PKG. The module must depend on it."
            exit 99
          }
          echo "Installed $PKG version: $INSTALLED"

          MAJOR=${INSTALLED%%.*}
          if [ "$MAJOR" -le 2 ]; then
            FLOOR="2.8.0"
          elif [ "$MAJOR" -eq 3 ]; then
            FLOOR="3.1.0"
          else
            echo "$PKG $INSTALLED is new enough"
            exit 0
          fi

          # INSTALLED >= FLOOR when FLOOR sorts lowest (or they are equal)
          LOWEST=$(printf '%s\n%s\n' "$INSTALLED" "$FLOOR" | sort -V | head -n1)
          if [ "$INSTALLED" = "$FLOOR" ] || [ "$LOWEST" = "$FLOOR" ]; then
            echo "$PKG $INSTALLED meets the minimum ($FLOOR)"
            exit 0
          fi

          echo "::error::$PKG version $INSTALLED is below the minimum supported version ($FLOOR). Please upgrade $PKG."
          exit 99

      - name: Build module
        shell: bash
        run: |
          # Some modules have a build script, but many do not
          if jq -e '.scripts.build' package.json > /dev/null; then
            yarn run build
          fi

      - name: Package module
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.prerelease }}" == "true" ]; then
            EXTRA_ARGS="--prerelease"
          fi

          yarn companion-module-build --output=pkg $EXTRA_ARGS

      - name: Upload artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v6
        with:
          name: pkg
          path: 'pkg.tgz'

      - name: Check module launches
        shell: bash
        timeout-minutes: 1
        # This isn't a nice check, and doesn't give a clean output, but hopefully this is enough to catch some issues
        # note: this must be done after the artifact upload, to ensure it doesn't accidentally mangle the package
        run: |
          set +e # disable errexit so we can capture node's non-zero exit without aborting the step

          MODULE_NAME="${{ steps.collect-info.outputs.module-name }}"
          if [ -f "pkg/${MODULE_NAME}/main.js" ]; then
            MAIN_JS="pkg/${MODULE_NAME}/main.js"
            MANIFEST_PATH="pkg/${MODULE_NAME}/companion/manifest.json"
          else
            MAIN_JS="pkg/main.js"
            MANIFEST_PATH="pkg/companion/manifest.json"
          fi

          API_VERSION=$(jq -r '.runtime.apiVersion // "0.0.0"' "$MANIFEST_PATH")
          API_MAJOR=$(echo "$API_VERSION" | cut -d. -f1)

          if [ "$API_MAJOR" == "2" ]; then
            echo "Testing module with connection API 2.x loading logic"

            # For connections with API 2.x: import main.js and verify the exported value (or its default) is a function
            RESULT=$(MAIN_JS="$MAIN_JS" node -e "
              (async () => {
                const mainPath = 'file://' + process.cwd() + '/' + process.env.MAIN_JS;
                const mod = await import(mainPath);
                const isFunction = typeof mod === 'function' || typeof mod.default === 'function';
                if (!isFunction) {
                  process.stderr.write('Module export is not a function\n');
                  process.exit(99);
                }
                process.stdout.write('Module export is a function\n');
              })().catch(e => { process.stderr.write(String(e) + '\n'); process.exit(99); });
              " 2>&1)
            CODE=$?
          else
            echo "Testing with import only loading logic"

            RESULT=$(node "$MAIN_JS" 2>&1)
            CODE=$?
          fi

          if [ $CODE -eq 0 ]; then
            echo "Module loaded successfully"
          elif echo "$RESULT" | grep -q "Failed to startup module"; then
            # This means it is a connection, and the entrypoint was the cause of the exit
            echo "Module loaded successfully"
          else
            echo "Module failed to load:"
            echo "$RESULT"
            exit 99
          fi
